[env:lolin32]
platform = espressif32
board = lolin32
framework = arduino
monitor_speed = 115200

upload_protocol = espota
upload_port = 192.168.1.20 ; IP of the ESP
upload_flags = "--auth=${sysenv.OTA_PASSWORD}"


lib_deps = 
	https://github.com/FastLED/FastLED.git
	https://github.com/adafruit/Adafruit_TCS34725.git
	esphome/ESPAsyncWebServer-esphome



build_flags =
    -D USE_LITTLEFS
	-D USE_LEDS
	-D USE_COLORSENSOR	# flag must be set if linefollower flag is set
	-D USE_LINEFOLLOWER
	#-D USE_PS5_CONTROLLER
	-D USE_WEBSERVER



board_build.filesystem = littlefs